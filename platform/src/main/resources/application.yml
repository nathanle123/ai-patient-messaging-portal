spring:
  application:
    name: portal-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portal}
    username: ${DB_USER:portal}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      # Applied by db/migration/afterMigrate.sql; hex only (openssl rand -hex 16).
      search_db_password: ${SEARCH_DB_PASSWORD:}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    mapper:
      accept-case-insensitive-enums: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      group-id: platform-results
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      # Commit each record's offset only after the listener returns (persisted) or the error
      # handler has published it to the DLQ.
      ack-mode: record
      concurrency: 3
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  demo:
    # Enables POST /api/demo/messages (source tags + backdated submissions) for the seed script.
    enabled: ${DEMO_MODE:false}
  analytics:
    # Scheduled batch aggregation. Hourly buckets for the last 48 h are recomputed every 15 minutes
    # (so late AI results land in the right bucket); daily buckets nightly; everything at startup.
    hourly-cron: ${ANALYTICS_HOURLY_CRON:0 */15 * * * *}
    daily-cron: ${ANALYTICS_DAILY_CRON:0 15 0 * * *}
    live-window: 60m
    health-interval: 10s
    services:
      phi-detection: ${PHI_SERVICE_URL:http://localhost:8001}
      urgency: ${URGENCY_SERVICE_URL:http://localhost:8002}
      routing: ${ROUTING_SERVICE_URL:http://localhost:8010}
      summarization: ${SUMMARIZATION_SERVICE_URL:http://localhost:8004}
      search: ${SEARCH_SERVICE_URL:http://localhost:8005}
      fhir: ${FHIR_HEALTH_URL:http://localhost:8006}
  phi:
    url: ${PHI_SERVICE_URL:http://localhost:8001}
    connect-timeout: 1s
    read-timeout: 5s
  fhir:
    # Patient lookup on intake (by MRN) and Communication write-back (redacted text only).
    enabled: ${FHIR_ENABLED:true}
    base-url: ${FHIR_BASE_URL:http://localhost:8006/fhir}
    connect-timeout: 1s
    read-timeout: 3s
    patient-cache-ttl: 10m
    # Pending write-backs (FHIR outage, full queue, restart) are retried by a sweeper.
    sweep-interval: ${FHIR_SWEEP_INTERVAL:15s}
    sweep-batch: 50
  similarity:
    # Minimum cosine similarity for a neighbour to be shown as "similar". Tuned from seeded data
    # (scripts/tune_similarity_threshold.py); see docs/design-notes.md.
    threshold: ${SIMILARITY_THRESHOLD:0.52}
  outbox:
    # Messages redacted but not yet acknowledged by Kafka are republished after this delay.
    republish-after: 10s
  jwt:
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:60m}
    issuer: portal-platform
  seed:
    enabled: ${SEED_DEMO_USERS:false}
    demo-password: ${DEMO_USER_PASSWORD:}
    fake-phi-path: ${FAKE_PHI_PATH:../fake_phi.csv}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Patient Portal Messaging Platform
    notice: Educational demonstration. Synthetic data only. Not clinically validated.

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    # Never log SQL bind parameters: they would include message text from Phase 3 on.
    org.hibernate.orm.jdbc.bind: OFF
