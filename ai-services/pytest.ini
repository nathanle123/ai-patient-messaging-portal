[pytest]
# Unit tests stub every model and run anywhere (CI included). Tests marked "model" load the real
# models and run only inside the built images:  docker compose run --rm <service> pytest -m model
markers =
    model: needs the real model baked into the service image
addopts = -m "not model" -q
testpaths = phi_detection urgency routing summarization similarity_search portal_common
